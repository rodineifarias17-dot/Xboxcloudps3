name: Build PKG PS3
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GAME folder PS3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-powerpc64-linux-gnu python3-pip > /dev/null
          pip3 install Pillow --break-system-packages -q
          mkdir -p game/XBOXCLOUD0/USRDIR build
          echo 'int main(){return 0;}' > /tmp/main.c
          powerpc64-linux-gnu-gcc -o game/XBOXCLOUD0/USRDIR/EBOOT.BIN /tmp/main.c
          ls -lh game/XBOXCLOUD0/USRDIR/
          python3 << 'PY'
          import struct
          keys=[b'TITLE',b'TITLE_ID',b'CATEGORY',b'APP_VER',b'VERSION',b'PS3_SYSTEM_VER']
          vals=[b'Xbox Cloud PS3\x00',b'XBOXCLOUD0\x00',b'HG\x00',b'01.00\x00',b'01.00\x00',b'04.4000\x00']
          h=20+len(keys)*16+sum(len(k)+1 for k in keys)
          o=bytearray(); o+=struct.pack('<4sIIII',b'\x00PSF',0x101,len(keys),len(keys)*16+20,h)
          ok=20+len(keys)*16; ov=h
          for k,v in zip(keys,vals):
            o+=struct.pack('<HHHHI',0x0402 if k==b'TITLE' else 0x0204,len(v),len(v),ok,ov); ok+=len(k)+1; ov+=len(v)
          for k in keys: o+=k+b'\x00'
          for v in vals: o+=v
          open('game/XBOXCLOUD0/PARAM.SFO','wb').write(o)
          print("PARAM OK")
          PY
          python3 -c "from PIL import Image, ImageDraw; img=Image.new('RGB',(320,176),(16,124,16)); d=ImageDraw.Draw(img); d.text((80,80),'XBOX CLOUD',fill=(255,255,255)); img.save('game/XBOXCLOUD0/ICON0.PNG')"
          ls -lhR game/
          cd game && zip -r ../build/XboxCloud-PS3-GAME.zip XBOXCLOUD0 && cd ..
          ls -lh build/
      - uses: actions/upload-artifact@v4
        with:
          name: XboxCloud-PS3-GAME
          path: build/