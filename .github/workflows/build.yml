name: Build PKG PS3
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar PKG Real
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip imagemagick
          pip3 install Pillow
          mkdir -p pkg/USRDIR
          # Cria icone 320x176 verde Xbox
          python3 -c "from PIL import Image; Image.new('RGB',(320,176),(16,124,16)).save('pkg/ICON0.PNG')"
          # Cria EBOOT falso por enquanto, depois vira o real
          echo "XBOXCLOUD" > pkg/USRDIR/EBOOT.BIN
          # PARAM.SFO real
          python3 << 'PY'
          import struct
          def sfo():
              keys = [b'TITLE', b'TITLE_ID', b'CATEGORY', b'APP_VER', b'VERSION']
              vals = [b'Xbox Cloud PS3\x00', b'XBOXCLOUD0\x00', b'HG\x00', b'01.00\x00', b'01.00\x00']
              header_len = 20 + len(keys)*16 + sum(len(k)+1 for k in keys)
              data_off = header_len
              out = bytearray()
              out += struct.pack('<4sIIII', b'\x00PSF', 0x101, len(keys), len(keys)*16+20, data_off)
              off_k = 20 + len(keys)*16
              off_v = data_off
              for k,v in zip(keys,vals):
                  out += struct.pack('<HHHHI', 0x0402 if k==b'TITLE' else 0x0204, len(v), len(v), off_k, off_v)
                  off_k += len(k)+1
                  off_v += len(v)
              for k in keys: out += k + b'\x00'
              for v in vals: out += v
              open('pkg/PARAM.SFO','wb').write(out)
          sfo()
          PY
          ls -R pkg
          mkdir -p build
          cd pkg && zip -r ../build/XboxCloudPS3.pkg * && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: XboxCloudPS3-PKG
          path: build/