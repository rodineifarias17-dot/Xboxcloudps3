name: Build PKG PS3
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PKG PS3
        run: |
          pip3 install Pillow --break-system-packages
          mkdir -p pkg/USRDIR build
          python3 -c "from PIL import Image, ImageDraw; img=Image.new('RGB',(320,176),(16,124,16)); d=ImageDraw.Draw(img); d.text((80,80),'XBOX CLOUD',fill=(255,255,255)); img.save('pkg/ICON0.PNG')"
          python3 << 'PY'
          import struct, os
          keys = [b'TITLE', b'TITLE_ID', b'CATEGORY', b'APP_VER', b'VERSION']
          vals = [b'Xbox Cloud PS3\x00', b'XBOXCLOUD0\x00', b'HG\x00', b'01.00\x00', b'01.00\x00']
          header_len = 20 + len(keys)*16 + sum(len(k)+1 for k in keys)
          out = bytearray()
          out += struct.pack('<4sIIII', b'\x00PSF', 0x101, len(keys), len(keys)*16+20, header_len)
          off_k = 20 + len(keys)*16
          off_v = header_len
          for k,v in zip(keys,vals):
              out += struct.pack('<HHHHI', 0x0402 if k==b'TITLE' else 0x0204, len(v), len(v), off_k, off_v)
              off_k += len(k)+1; off_v += len(v)
          for k in keys: out += k + b'\x00'
          for v in vals: out += v
          open('pkg/PARAM.SFO','wb').write(out)
          open('pkg/USRDIR/EBOOT.BIN','wb').write(b'XBOXCLOUD PS3 v1 - xbox.com/play')
          files=[]
          for root,dirs,fs in os.walk('pkg'):
              for f in fs:
                  p=os.path.join(root,f)
                  files.append((os.path.relpath(p,'pkg'), open(p,'rb').read()))
          pkg = bytearray()
          pkg += b'\x7FPKG' + struct.pack('>I',1) + struct.pack('>I',0x8000) + struct.pack('>Q',0x40) + struct.pack('>Q',0) + b'\x00'*32
          for name,data in files:
              pkg += struct.pack('>I', len(name)) + name.encode() + struct.pack('>I', len(data)) + data
          open('build/XboxCloudPS3.pkg','wb').write(pkg)
          print(f"OK - {len(pkg)} bytes")
          PY
          ls -lh build/
      - uses: actions/upload-artifact@v4
        with:
          name: XboxCloudPS3-PKG
          path: build/